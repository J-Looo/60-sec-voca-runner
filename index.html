<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>SCAVENGER - 終極穩定修正版</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #00d2ff; --bg: #0a0a0a; --panel: #151515; --glass: rgba(255,255,255,0.05); --speed-boost: #bf00ff; }
        body { margin: 0; background: var(--bg); overflow: hidden; font-family: 'Inter', sans-serif; color: white; user-select: none; touch-action: none; }
        
        /* 畫布 */
        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; }

        /* 畫面管理器 */
        .screen { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 5000; background: var(--bg); }
        .screen.active { display: flex; }

        /* 1. 首頁 */
        #home-screen { background: radial-gradient(circle at center, #1a1a1a 0%, #0a0a0a 100%); cursor: pointer; }
        .game-title { font-size: 80px; font-weight: 800; letter-spacing: -2px; margin-bottom: 10px; text-shadow: 0 0 30px rgba(0,210,255,0.5); pointer-events: none; }
        .press-hint { font-size: 18px; color: #555; animation: blink 1.5s infinite; pointer-events: none; }
        
        /* 要求 6: 獨立退出按鈕 */
        .btn-quit { position: absolute; bottom: 30px; right: 30px; padding: 12px 25px; background: rgba(255,68,68,0.1); border: 1px solid rgba(255,68,68,0.3); border-radius: 12px; color: #ff4444; font-size: 14px; font-weight: 800; cursor: pointer; transition: 0.2s; z-index: 5100; pointer-events: auto; }
        .btn-quit:hover { background: #ff4444; color: black; }

        /* 2. 模式選擇 */
        .mode-option { padding: 25px 60px; border-radius: 24px; transition: 0.3s; text-align: center; background: var(--panel); cursor: pointer; border: 2px solid transparent; margin-bottom: 15px; }
        .mode-option.selected { border-color: var(--accent); transform: scale(1.1); box-shadow: 0 0 30px rgba(0,210,255,0.3); }
        .mode-option h2 { margin: 0; color: #444; pointer-events: none; }
        .mode-option.selected h2 { color: var(--accent); }

        /* 3. 遊戲中 HUD */
        #game-hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 500; pointer-events: none; display: none; }
        #game-hud.active { display: block; }
        #joystick-base { position: absolute; bottom: 60px; left: 60px; width: 120px; height: 120px; background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.1); border-radius: 50%; pointer-events: auto; backdrop-filter: blur(5px); }
        #joystick-stick { position: absolute; top: 50%; left: 50%; width: 50px; height: 50px; background: var(--accent); border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; }

        /* 背包區域 */
        #inventory-hud { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); display: flex; gap: 12px; padding: 15px; background: rgba(0,0,0,0.95); border-radius: 20px; border: 1px solid #333; pointer-events: auto; transition: 0.4s; }
        #inventory-hud.altar-active { border-color: var(--accent); box-shadow: 0 0 30px rgba(0, 210, 255, 0.4); transform: translateX(-50%) scale(1.1); }
        .slot { width: 60px; height: 60px; background: #1a1a1a; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 26px; color: #333; border: 2px solid transparent; transition: 0.2s; position: relative; cursor: default; }
        .slot.has-item { color: var(--accent); background: #222; }
        
        /* 要求 4: 拖曳滑鼠型態 */
        .altar-active .slot.has-item { cursor: grab; }
        .altar-active .slot.has-item:active { cursor: grabbing; }
        .slot.kb-focus { border-color: #555; background: #333; transform: translateY(-5px); }
        .slot.kb-locked { border-color: #ffcc00 !important; color: #ffcc00 !important; transform: translateY(-10px); box-shadow: 0 0 15px #ffcc00; }
        .slot.dragging { opacity: 0.3; transform: scale(0.8); }

        /* 要求 3: 系統選單與右側累積表 */
        #system-menu-container { display: flex; gap: 20px; align-items: stretch; }
        .modal { background: rgba(25, 25, 25, 0.98); width: 350px; padding: 40px; border-radius: 32px; border: 1px solid #333; text-align: center; }
        .history-panel { width: 320px; background: rgba(20, 20, 20, 0.9); border: 1px solid #333; border-radius: 28px; padding: 30px; display: flex; flex-direction: column; text-align: left; }
        .history-list { overflow-y: auto; max-height: 400px; padding-right: 10px; }
        .history-list::-webkit-scrollbar { width: 4px; }
        .history-list::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        .history-item { margin-bottom: 12px; border-bottom: 1px solid #222; padding-bottom: 8px; }
        .history-en { font-weight: 800; font-size: 16px; color: #fff; }
        .history-zh { color: var(--accent); font-size: 13px; margin-top: 2px; }

        .menu-btn { width: 100%; padding: 16px; margin-bottom: 12px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); color: white; font-weight: 600; cursor: pointer; transition: 0.2s; font-size: 15px; }
        .menu-btn.selected { background: var(--accent); color: black; border-color: white; transform: scale(1.05); }

        /* HUD 元素 */
        #hud-top { position: absolute; top: 20px; left: 0; width: 100%; display: flex; flex-direction: column; align-items: center; pointer-events: none; }
        #timer-box { background: rgba(0,0,0,0.8); padding: 10px 30px; border-radius: 12px; border: 2px solid #444; font-size: 28px; font-weight: 800; }
        .time-plus-pop { position: absolute; right: -70px; top: 0; color: #00ff88; font-weight: 800; font-size: 24px; animation: floatUpFade 1s forwards; }

        #status-column { position: absolute; top: 20px; left: 20px; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
        .status-bar { width: 180px; padding: 10px; background: rgba(0,0,0,0.8); border-radius: 10px; border: 1px solid #444; display: none; }
        .bar-container { width: 100%; height: 5px; background: #222; border-radius: 3px; margin-top: 6px; overflow: hidden; }
        .bar-fill { height: 100%; width: 100%; transition: width 0.1s linear; }

        @keyframes blink { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
        @keyframes floatUpFade { 0% { transform: translateY(10px); opacity: 0; } 30% { transform: translateY(-5px); opacity: 1; } 100% { transform: translateY(-40px); opacity: 0; } }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <!-- 1. 首頁 -->
    <div id="home-screen" class="screen active" onmousedown="handleStartTrigger(event)">
        <div class="game-title">SCAVENGER</div>
        <div class="press-hint">PRESS ANY KEY OR CLICK TO START</div>
        <!-- 要求 6: 退出按鈕 -->
        <div class="btn-quit" onclick="event.stopPropagation(); window.close();">QUIT GAME</div>
    </div>

    <!-- 2. 模式選擇 -->
    <div id="mode-screen" class="screen">
        <h1 style="margin-bottom: 40px; font-size: 32px;">挑戰模式</h1>
        <div class="mode-container">
            <div id="mode-0" class="mode-option selected" onclick="selectMode('preset')"><h2>關卡挑戰</h2><p>系統預設庫</p></div>
            <div id="mode-1" class="mode-option" onclick="changeScreen('custom-screen')"><h2>自製關卡</h2><p>自訂匯入</p></div>
        </div>
        <p style="margin-top:40px; color:#555; font-size:14px;">[方向鍵] 切換 · [E] 進入 · [Q] 返回</p>
    </div>

    <!-- 3. 自製匯入 (要求 1: 修正解析) -->
    <div id="custom-screen" class="screen">
        <div style="background: var(--panel); padding: 40px; border-radius: 28px; width: 480px; text-align: center;">
            <h2 style="margin:0">匯入清單</h2>
            <textarea id="custom-input" style="width:100%; height:160px; background:#000; border:1px solid #444; color:white; padding:15px; margin:20px 0; border-radius:12px;" placeholder="apple 蘋果 n.&#10;wear out 用壞 v. ph."></textarea>
            <button id="custom-start-btn" class="menu-btn selected" onclick="handleCustomStart()">完成匯入並開始</button>
            <button class="menu-btn" style="border:none" onclick="changeScreen('mode-screen')">返回 [Q]</button>
        </div>
    </div>

    <!-- 4. 遊戲 HUD -->
    <div id="game-hud">
        <div id="joystick-base"><div id="joystick-stick"></div></div>
        <div id="hud-top">
            <div id="target-display" style="background:rgba(0,210,255,0.1); padding:8px 24px; border-radius:10px; border:1px solid rgba(0,210,255,0.2); font-size:14px; margin-bottom:12px;">尋找單字: <span id="current-target" style="font-weight:800;">---</span></div>
            <div id="timer-wrapper"><div id="timer-box"><span id="time-val">60</span>s</div></div>
        </div>
        <div id="inventory-hud"></div>
        <div id="menu-icon" onclick="toggleMenu()" style="position:absolute; top:20px; right:20px; width:45px; height:45px; background:rgba(255,255,255,0.1); border-radius:12px; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:5px; pointer-events:auto; cursor:pointer;"><span></span><span></span><span></span></div>
        
        <div id="status-column">
            <div id="drill-bar" class="status-bar"><span style="color:#ffcc00; font-size:11px; font-weight:800;">⚒️ 鑽頭功能啟動</span><div class="bar-container"><div class="bar-fill" id="drill-fill" style="background:#ffcc00"></div></div></div>
            <div id="signal-bar" class="status-bar"><span style="color:#00ff88; font-size:11px; font-weight:800;">📡 追蹤訊號啟動</span><div class="bar-container"><div class="bar-fill" id="signal-fill" style="background:#00ff88"></div></div></div>
            <div id="speed-bar" class="status-bar"><span style="color:var(--speed-boost); font-size:11px; font-weight:800;">⚡ 超速移動中</span><div class="bar-container"><div class="bar-fill" id="speed-fill" style="background:var(--speed-boost)"></div></div></div>
        </div>
    </div>

    <!-- 5. 系統選單 (要求 3: 雙欄顯示) -->
    <div id="system-menu" class="screen" style="background:rgba(0,0,0,0.7); backdrop-filter:blur(10px); z-index: 6000;">
        <div id="system-menu-container">
            <div class="modal">
                <div style="font-size:12px; color:#555; letter-spacing:2px; font-weight:800; margin-bottom:30px;">SYSTEM MENU</div>
                <button id="sys-0" class="menu-btn selected" onclick="toggleMenu()">繼續遊戲 / CONTINUE</button>
                <button id="sys-1" class="menu-btn" onclick="resetCurrentLevel()">重置本關 / RESET</button>
                <button id="sys-2" class="menu-btn" style="color:#ff4444" onclick="location.reload()">返回首頁 / HOME</button>
            </div>
            <div class="history-panel">
                <div style="font-size:11px; color:#555; font-weight:800; margin-bottom:15px; letter-spacing: 1px;">已解鎖資料 HISTORY</div>
                <div id="history-list" class="history-list">尚未拼出單字</div>
            </div>
        </div>
    </div>

    <!-- 6. 結束畫面 -->
    <div id="game-over-screen" class="screen">
        <div class="modal" style="border: 2px solid #ff4444;">
            <h1 style="color:#ff4444; margin:0">TIME UP</h1>
            <button id="over-0" class="menu-btn selected" onclick="restartGame()">再試一次 / RESTART</button>
            <button id="over-1" class="menu-btn" onclick="location.reload()">回到標題 / HOME</button>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    let WORD_DB = { "APPLE": { zh: "蘋果", pos: "n." }, "PIXEL": { zh: "像素", pos: "n." }, "SPACE": { zh: "空間", pos: "n." }, "WEAR OUT": { zh: "用壞", pos: "v. ph." } };
    let WORD_POOL = Object.keys(WORD_DB);

    let state = {
        screen: 'home', worldX: 0, worldY: 0, speed: 5.5,
        letters: [], inventory: [], completedWords: [],
        targetWord: "", timeLeft: 60, keys: {},
        isPaused: false, joystick: { active: false, vx: 0, vy: 0 },
        isSortingMode: false, kbSortIdx: 0, kbLockedIdx: null, draggedIndex: null,
        menuIdx: 0, walls: [], items: [], speedPads: [], drillTime: 0, signalTime: 0, boostTime: 0
    };

    const SAFE_ZONE = 160;
    const KEY_MAP = { 'KeyW': 'Up', 'ArrowUp': 'Up', 'KeyS': 'Down', 'ArrowDown': 'Down', 'KeyA': 'Left', 'ArrowLeft': 'Left', 'KeyD': 'Right', 'ArrowRight': 'Right' };

    // --- 全域輸入監聽器 ---
    function handleStartTrigger(e) { 
        if(e && e.target && e.target.classList.contains('btn-quit')) return; 
        if(state.screen === 'home') changeScreen('mode-screen'); 
    }

    window.addEventListener('keydown', e => {
        // 要求 1: textarea 聚焦時鎖定所有遊戲快捷鍵
        if(document.activeElement.tagName === 'TEXTAREA') return;

        // 要求 5: 隔離首頁 Q 鍵，防止連續跳轉
        if(state.screen === 'home') {
            handleStartTrigger();
            return;
        }

        if (e.code === 'KeyE') {
            if (state.screen === 'playing') {
                if (Math.hypot(state.worldX, state.worldY) < 85) {
                    state.isSortingMode = !state.isSortingMode;
                    state.kbSortIdx = 0; state.kbLockedIdx = null;
                    updateUI(); return;
                }
            } else {
                const currentBtn = document.querySelector('.screen.active .menu-btn.selected, .screen.active .mode-option.selected');
                if (currentBtn) currentBtn.click();
                return;
            }
        }

        if (e.code === 'KeyQ') {
            if (state.isSortingMode) { state.isSortingMode = false; updateUI(); return; }
            if (state.screen === 'system-menu') { toggleMenu(); return; }
            if (state.screen === 'custom-screen') { changeScreen('mode-screen'); return; }
            if (state.screen === 'mode-screen') { location.reload(); return; }
        }

        if (e.code === 'Tab') { 
            e.preventDefault(); 
            if(state.screen === 'custom-screen') {
                const input = document.getElementById('custom-input');
                const btn = document.getElementById('custom-start-btn');
                if(document.activeElement === input) btn.focus(); else input.focus();
            } else if(state.screen==='playing' || state.screen==='system-menu') {
                toggleMenu(); 
            }
            return; 
        }

        const dir = KEY_MAP[e.code];
        if (dir && (state.screen !== 'playing' || state.isSortingMode)) { handleNav(dir); return; }

        if (e.code === 'Space' && state.isSortingMode) {
            state.kbLockedIdx = (state.kbLockedIdx === state.kbSortIdx) ? null : state.kbSortIdx;
            updateUI(); return;
        }

        if (state.screen === 'playing') state.keys[e.code] = true;
    });

    window.addEventListener('keyup', e => state.keys[e.code] = false);

    function handleNav(dir) {
        const options = { 'mode-screen': 2, 'system-menu': 3, 'game-over-screen': 2 }[state.screen];
        if (options) {
            const move = (dir === 'Up' || dir === 'Left') ? -1 : 1;
            state.menuIdx = (state.menuIdx + move + options) % options;
            updateMenuVisuals();
        }
        if (state.isSortingMode) {
            const move = (dir === 'Left' || dir === 'Up') ? -1 : 1;
            const nextIdx = Math.max(0, Math.min(state.inventory.length - 1, state.kbSortIdx + move));
            if (state.kbLockedIdx !== null) {
                [state.inventory[state.kbSortIdx], state.inventory[nextIdx]] = [state.inventory[nextIdx], state.inventory[state.kbSortIdx]];
                state.kbLockedIdx = nextIdx;
            }
            state.kbSortIdx = nextIdx;
            updateUI();
            checkWin(); // 即時判定
        }
    }

    // --- 虛擬搖桿 ---
    const jBase = document.getElementById('joystick-base');
    const jStick = document.getElementById('joystick-stick');
    function handleJoystick(e) {
        if (!state.joystick.active) return;
        const rect = jBase.getBoundingClientRect();
        const cx = rect.left + 60, cy = rect.top + 60;
        const clX = e.touches ? e.touches[0].clientX : e.clientX, clY = e.touches ? e.touches[0].clientY : e.clientY;
        let dx = clX - cx, dy = clY - cy, dist = Math.hypot(dx, dy);
        if (dist > 50) { dx *= 50/dist; dy *= 50/dist; }
        jStick.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
        state.joystick.vx = dx/50; state.joystick.vy = dy/50;
    }
    jBase.addEventListener('mousedown', () => state.joystick.active = true);
    jBase.addEventListener('touchstart', () => state.joystick.active = true);
    window.addEventListener('mousemove', handleJoystick); window.addEventListener('touchmove', handleJoystick);
    const stopJ = () => { state.joystick.active = false; state.joystick.vx = 0; state.joystick.vy = 0; jStick.style.transform = 'translate(-50%, -50%)'; };
    window.addEventListener('mouseup', stopJ); window.addEventListener('touchend', stopJ);

    // --- 核心遊戲與 要求 2: 即時判定 ---
    function spawnItem(type) {
        if(state.items.some(it => it.type === type)) return;
        let x, y, safe = false;
        while(!safe) {
            const ang = Math.random()*Math.PI*2, dist = 300+Math.random()*400;
            x = state.worldX + Math.cos(ang)*dist; y = state.worldY + Math.sin(ang)*dist;
            safe = true;
            for(let w of state.walls) if(x > w.x - 20 && x < w.x + 60 && y > w.y - 20 && y < w.y + 60) safe = false;
            if(Math.hypot(x,y) < SAFE_ZONE) safe = false;
        }
        state.items.push({ x, y, type });
    }

    function initLevel() {
        state.targetWord = WORD_POOL[Math.floor(Math.random() * WORD_POOL.length)];
        state.inventory = []; state.letters = []; state.walls = []; state.items = []; state.speedPads = [];
        state.drillTime = 0; state.signalTime = 0; state.boostTime = 0;
        document.getElementById('current-target').innerText = state.targetWord;

        const chars = state.targetWord.replace(/\s+/g, '').split('');
        chars.forEach(char => {
            let rx, ry; do { rx = (Math.random()-0.5)*1400; ry = (Math.random()-0.5)*1400; } while (Math.hypot(rx, ry) < 160);
            state.letters.push({ x: rx, y: ry, char });
            for(let i=0; i<3; i++) {
                let wx = rx + (Math.floor(Math.random()*3)-1)*40, wy = ry + (Math.floor(Math.random()*3)-1)*40;
                if (Math.hypot(wx, wy) > 160) state.walls.push({ x: wx, y: wy, w: 40, h: 40 });
            }
        });
        state.inventory = new Array(chars.length).fill("");
        for(let i=0; i<5; i++) state.speedPads.push({ x: (Math.random()-0.5)*1200, y: (Math.random()-0.5)*1200 });
        spawnItem('drill'); spawnItem('signal'); updateUI();
    }

    // --- 拖曳與 UI ---
    function initDragEvents(slot, index) {
        slot.draggable = true;
        slot.ondragstart = (e) => { 
            if(!document.getElementById('inventory-hud').classList.contains('altar-active')) return e.preventDefault(); 
            state.draggedIndex = index; 
            slot.classList.add('dragging'); 
        };
        slot.ondragover = e => e.preventDefault();
        slot.ondrop = () => { 
            if(state.draggedIndex !== null && state.draggedIndex !== index) { 
                [state.inventory[state.draggedIndex], state.inventory[index]] = [state.inventory[index], state.inventory[state.draggedIndex]]; 
                updateUI(); 
                checkWin(); // 即時判定
            } 
        };
        slot.ondragend = () => { slot.classList.remove('dragging'); state.draggedIndex = null; };
    }

    function updateUI() {
        const inv = document.getElementById('inventory-hud'); inv.innerHTML = '';
        state.inventory.forEach((char, i) => {
            const s = document.createElement('div');
            s.className = `slot ${char ? 'has-item' : ''} ${state.isSortingMode && state.kbSortIdx === i ? 'kb-focus' : ''} ${state.isSortingMode && state.kbLockedIdx === i ? 'kb-locked' : ''}`;
            s.innerText = char || ""; if(char) initDragEvents(s, i); inv.appendChild(s);
        });
    }

    function update(dt) {
        if(state.screen !== 'playing' || state.isPaused) return;

        if(state.drillTime > 0) { state.drillTime -= dt; if(state.drillTime <= 0) spawnItem('drill'); }
        if(state.signalTime > 0) { state.signalTime -= dt; if(state.signalTime <= 0) spawnItem('signal'); }
        if(state.boostTime > 0) state.boostTime -= dt;

        const isAltar = Math.hypot(state.worldX, state.worldY) < 80;
        document.getElementById('inventory-hud').classList.toggle('altar-active', isAltar);
        
        // 要求 2: 在祭壇內即時判定勝負
        if(isAltar) checkWin();

        if (state.isSortingMode) return;

        let mx = 0, my = 0;
        if(state.keys['KeyW'] || state.keys['ArrowUp']) my = -1;
        if(state.keys['KeyS'] || state.keys['ArrowDown']) my = 1;
        if(state.keys['KeyA'] || state.keys['ArrowLeft']) mx = -1;
        if(state.keys['KeyD'] || state.keys['ArrowRight']) mx = 1;
        if (state.joystick.vx !== 0 || state.joystick.vy !== 0) { mx = state.joystick.vx; my = state.joystick.vy; }
        
        const curSpeed = (state.boostTime > 0 ? state.speed * 1.5 : state.speed);
        const fx = mx * curSpeed, fy = my * curSpeed;
        const getCol = (nx, ny) => { for(let w of state.walls) if(nx+14 > w.x && nx-14 < w.x+w.w && ny+14 > w.y && ny-14 < w.y+w.h) return w; return null; };
        
        let wX = getCol(state.worldX + fx, state.worldY);
        if(!wX) state.worldX += fx; else if(state.drillTime > 0) state.walls = state.walls.filter(w => w !== wX);
        let wY = getCol(state.worldX, state.worldY + fy);
        if(!wY) state.worldY += fy; else if(state.drillTime > 0) state.walls = state.walls.filter(w => w !== wY);

        state.speedPads.forEach(p => { if(Math.hypot(p.x - state.worldX, p.y - state.worldY) < 30) state.boostTime = 3000; });
        state.items = state.items.filter(it => {
            if(Math.hypot(it.x - state.worldX, it.y - state.worldY) < 35) {
                if(it.type === 'drill') state.drillTime = 10000;
                if(it.type === 'signal') state.signalTime = 8000;
                return false;
            } return true;
        });
        state.letters = state.letters.filter(l => {
            if(Math.hypot(l.x - state.worldX, l.y - state.worldY) < 35) {
                const emptyIdx = state.inventory.indexOf("");
                if(emptyIdx !== -1) { state.inventory[emptyIdx] = l.char; updateUI(); return false; }
            } return true;
        });

        document.getElementById('drill-bar').style.display = state.drillTime > 0 ? 'block' : 'none';
        document.getElementById('drill-fill').style.width = (state.drillTime / 10000 * 100) + '%';
        document.getElementById('signal-bar').style.display = state.signalTime > 0 ? 'block' : 'none';
        document.getElementById('signal-fill').style.width = (state.signalTime / 8000 * 100) + '%';
        document.getElementById('speed-bar').style.display = state.boostTime > 0 ? 'block' : 'none';
        document.getElementById('speed-fill').style.width = (state.boostTime / 3000 * 100) + '%';
    }

    function checkWin() {
        if(state.inventory.join('') === state.targetWord.replace(/\s+/g, '')) {
            state.completedWords.push(state.targetWord); state.timeLeft += 60;
            const pop = document.createElement('div'); pop.className='time-plus-pop'; pop.innerText='+60s';
            document.getElementById('timer-wrapper').appendChild(pop); setTimeout(()=>pop.remove(), 1000);
            state.isSortingMode = false; initLevel();
        }
    }

    function draw() {
        const cx = canvas.width/2, cy = canvas.height/2; 
        ctx.fillStyle = '#0a0a0a'; ctx.fillRect(0,0,canvas.width,canvas.height);

        if(state.screen === 'playing') {
            ctx.strokeStyle = '#181818';
            for(let x=-state.worldX%50; x<canvas.width; x+=50) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,canvas.height); ctx.stroke(); }
            for(let y=-state.worldY%50; y<canvas.height; y+=50) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(canvas.width,y); ctx.stroke(); }
            
            state.speedPads.forEach(p => {
                ctx.fillStyle = `rgba(191, 0, 255, ${0.2 + Math.abs(Math.sin(Date.now()/300))*0.3})`;
                ctx.fillRect(cx+p.x-state.worldX-25, cy+p.y-state.worldY-25, 50, 50);
            });
            ctx.strokeStyle = '#00d2ff'; ctx.lineWidth = 4; ctx.strokeRect(cx-60-state.worldX, cy-60-state.worldY, 120, 120);
            ctx.fillStyle = '#333'; state.walls.forEach(w => ctx.fillRect(cx+w.x-state.worldX, cy+w.y-state.worldY, w.w-1, w.h-1));
            state.items.forEach(it => { ctx.fillStyle = it.type === 'drill' ? '#ffcc00' : '#00ff88'; ctx.beginPath(); ctx.arc(cx+it.x-state.worldX, cy+it.y-state.worldY, 18, 0, Math.PI*2); ctx.fill(); });
            state.letters.forEach(l => {
                const lx = cx+l.x-state.worldX, ly = cy+l.y-state.worldY;
                ctx.fillStyle = '#ffcc00'; ctx.shadowBlur = 15; ctx.shadowColor = '#ffcc00';
                ctx.fillRect(lx-18, ly-18, 36, 36); ctx.shadowBlur = 0;
                ctx.fillStyle = '#000'; ctx.font = '800 22px Inter'; ctx.textAlign = 'center'; ctx.fillText(l.char, lx, ly+8);
            });
            if(state.signalTime > 0) {
                state.letters.forEach(l => {
                    const ang = Math.atan2(l.y - state.worldY, l.x - state.worldX);
                    ctx.save(); ctx.translate(cx, cy); ctx.rotate(ang);
                    ctx.fillStyle = '#00ff88'; ctx.beginPath(); ctx.moveTo(45,0); ctx.lineTo(35,-5); ctx.lineTo(35,5); ctx.fill(); ctx.restore();
                });
            }
            ctx.fillStyle = '#fff'; ctx.fillRect(cx-15, cy-15, 30, 30);
            ctx.strokeStyle = '#00d2ff'; ctx.strokeRect(cx-15, cy-15, 30, 30);
        }
        update(1000/60); requestAnimationFrame(draw);
    }

    // --- 其他控制 ---
    function changeScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        state.menuIdx = 0; state.isPaused = false; state.isSortingMode = false;
        if(id === 'playing') { document.getElementById('game-hud').classList.add('active'); state.screen = 'playing'; if(!state.targetWord) initLevel(); }
        else { document.getElementById('game-hud').classList.remove('active'); const target = document.getElementById(id); if(target) target.classList.add('active'); state.screen = id; updateMenuVisuals(); }
    }

    function updateMenuVisuals() {
        if (state.screen === 'mode-screen') { document.getElementById('mode-0').classList.toggle('selected', state.menuIdx === 0); document.getElementById('mode-1').classList.toggle('selected', state.menuIdx === 1); }
        else if (state.screen === 'system-menu') { 
            [0,1,2].forEach(i => document.getElementById(`sys-${i}`).classList.toggle('selected', state.menuIdx === i)); 
            const list = document.getElementById('history-list');
            list.innerHTML = state.completedWords.map(w => `<div class="history-item"><div class="history-en">${w}</div><div class="history-zh">${WORD_DB[w]?.zh || "自訂"}</div></div>`).join('') || "尚未拼出單字";
        }
        else if (state.screen === 'game-over-screen') { [0,1].forEach(i => document.getElementById(`over-${i}`).classList.toggle('selected', state.menuIdx === i)); }
    }

    // 要求 1: 解析修正，更寬鬆的匹配邏輯
    function handleCustomStart() {
        const input = document.getElementById('custom-input').value;
        const lines = input.split('\n').filter(l => l.trim().length > 0);
        const newDB = {};
        lines.forEach(line => {
            const parts = line.trim().split(/\s+/);
            if (parts.length >= 1) {
                const en = parts[0].toUpperCase();
                const zh = parts[1] || "自訂";
                const pos = parts[2] || "";
                newDB[en] = { zh, pos };
            }
        });
        if (Object.keys(newDB).length === 0) return alert("解析失敗");
        WORD_DB = newDB; WORD_POOL = Object.keys(newDB); startGame();
    }

    function selectMode(m) { if(m === 'preset') startGame(); }
    function startGame() { changeScreen('playing'); state.worldX = 0; state.worldY = 0; state.timeLeft = 60; state.completedWords = []; initLevel(); }
    function resetCurrentLevel() { state.timeLeft = 60; changeScreen('playing'); initLevel(); }
    function restartGame() { startGame(); }
    function toggleMenu() { if(state.screen==='playing') changeScreen('system-menu'); else if(state.screen==='system-menu') changeScreen('playing'); }
    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }

    setInterval(() => { if(state.screen === 'playing' && !state.isPaused) { state.timeLeft--; document.getElementById('time-val').innerText = state.timeLeft; if(state.timeLeft <= 0) changeScreen('game-over-screen'); } }, 1000);
    window.addEventListener('resize', resize); resize();
</script>
</body>
