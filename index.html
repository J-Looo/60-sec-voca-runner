<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>SCAVENGER - 虛擬搖桿與鍵盤操控版</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #00d2ff; --bg: #0a0a0a; --panel: #151515; --glass: rgba(255,255,255,0.05); --speed-boost: #bf00ff; }
        body { margin: 0; background: var(--bg); overflow: hidden; font-family: 'Inter', sans-serif; color: white; user-select: none; touch-action: none; }
        
        .screen { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 5000; background: var(--bg); }
        .screen.active { display: flex; }

        /* 1. 首頁 */
        #home-screen { background: radial-gradient(circle at center, #1a1a1a 0%, #0a0a0a 100%); cursor: pointer; }
        .game-title { font-size: 80px; font-weight: 800; letter-spacing: -2px; margin-bottom: 10px; text-shadow: 0 0 30px rgba(0,210,255,0.5); }
        .press-hint { font-size: 18px; color: #555; animation: blink 1.5s infinite; }

        /* 2. 模式選擇 */
        .mode-option { padding: 25px 60px; border-radius: 20px; transition: 0.3s; text-align: center; background: var(--panel); cursor: pointer; margin-bottom: 20px; border: 2px solid transparent; }
        .mode-option.selected { border-color: var(--accent); transform: scale(1.1); box-shadow: 0 0 30px rgba(0,210,255,0.3); }
        .mode-option h2 { margin: 0; color: #555; }
        .mode-option.selected h2 { color: var(--accent); }

        /* 3. 遊戲中 HUD */
        #game-hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 500; pointer-events: none; display: none; }
        #game-hud.active { display: block; }

        /* 要求 1: 虛擬搖桿 (Joystick) */
        #joystick-base {
            position: absolute; bottom: 60px; left: 60px; width: 120px; height: 120px;
            background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.1);
            border-radius: 50%; pointer-events: auto; backdrop-filter: blur(5px);
        }
        #joystick-stick {
            position: absolute; top: 50%; left: 50%; width: 50px; height: 50px;
            background: var(--accent); border-radius: 50%;
            transform: translate(-50%, -50%); box-shadow: 0 0 20px rgba(0,210,255,0.5);
            pointer-events: none;
        }

        /* 要求 4: 鍵盤排序 UI 提示 */
        #inventory-hud { 
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); 
            display: flex; gap: 12px; padding: 15px; background: rgba(0,0,0,0.9); 
            border-radius: 20px; border: 1px solid #333; pointer-events: auto;
            transition: all 0.4s;
        }
        #inventory-hud.altar-active { border-color: var(--accent); box-shadow: 0 0 30px rgba(0,210,255,0.3); transform: translateX(-50%) scale(1.1); }
        .slot { 
            width: 60px; height: 60px; background: #1a1a1a; border-radius: 12px; 
            display: flex; align-items: center; justify-content: center; 
            font-weight: 800; font-size: 26px; color: #333; border: 2px solid transparent; 
            transition: transform 0.2s, border-color 0.2s;
        }
        .slot.has-item { color: var(--accent); background: #222; }
        
        /* 鍵盤焦點與選中狀態 */
        .slot.kb-focus { border-color: #555; background: #333; transform: translateY(-5px); }
        .slot.kb-locked { border-color: #ffcc00 !important; color: #ffcc00 !important; box-shadow: 0 0 15px #ffcc00; transform: translateY(-10px) scale(1.1); }

        #altar-keyboard-hint {
            position: absolute; bottom: 130px; left: 50%; transform: translateX(-50%);
            background: var(--accent); color: black; padding: 5px 15px; border-radius: 5px;
            font-weight: 800; font-size: 12px; opacity: 0; transition: 0.3s;
        }
        #altar-keyboard-hint.visible { opacity: 1; }

        /* 系統選單與計時器 (保留之前美學) */
        #hud-top { position: absolute; top: 20px; left: 0; width: 100%; display: flex; flex-direction: column; align-items: center; pointer-events: none; }
        #timer-box { background: rgba(0,0,0,0.8); padding: 10px 30px; border-radius: 12px; border: 2px solid #444; font-size: 28px; font-weight: 800; position: relative; }
        .modal { background: rgba(25, 25, 25, 0.98); width: 380px; padding: 40px; border-radius: 32px; border: 1px solid #333; text-align: center; }
        .menu-btn { width: 100%; padding: 16px; margin-bottom: 12px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); color: white; font-weight: 600; cursor: pointer; transition: 0.2s; font-size: 15px; }
        .menu-btn.selected { background: var(--accent); color: black; }

        @keyframes blink { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <!-- 1. 首頁 -->
    <div id="home-screen" class="screen active">
        <div class="game-title">SCAVENGER</div>
        <div class="press-hint">PRESS ANY KEY OR CLICK TO START</div>
    </div>

    <!-- 2. 模式選擇 -->
    <div id="mode-screen" class="screen">
        <h1 style="margin-bottom: 40px;">挑戰模式</h1>
        <div id="mode-0" class="mode-option selected" onclick="selectMode('preset')"><h2>關卡挑戰</h2><p>系統預設庫</p></div>
        <div id="mode-1" class="mode-option" onclick="changeScreen('custom-screen')"><h2>自製關卡</h2><p>自訂匯入</p></div>
    </div>

    <!-- 3. 自製輸入 -->
    <div id="custom-screen" class="screen">
        <div class="modal">
            <h2>匯入清單</h2>
            <textarea id="custom-input" style="width:100%; height:150px; background:#000; border:1px solid #444; color:white; padding:10px; margin:20px 0;" placeholder="apple 蘋果 n."></textarea>
            <button class="menu-btn selected" onclick="handleCustomStart()">完成匯入並開始</button>
            <button class="menu-btn" style="border:none" onclick="changeScreen('mode-screen')">返回</button>
        </div>
    </div>

    <!-- 4. 遊戲 HUD -->
    <div id="game-hud">
        <!-- 要求 1: 虛擬搖桿 -->
        <div id="joystick-base">
            <div id="joystick-stick"></div>
        </div>

        <div id="hud-top">
            <div id="target-display" style="background:rgba(0,210,255,0.1); padding:8px 24px; border-radius:10px; border:1px solid rgba(0,210,255,0.2); font-size:14px; margin-bottom:12px;">尋找單字: <span id="current-target" style="font-weight:800;">---</span></div>
            <div id="timer-box"><span id="time-val">60</span>s</div>
        </div>

        <div id="altar-keyboard-hint">按 [E] 進入鍵盤排序模式</div>
        <div id="inventory-hud"></div>
        <div id="menu-icon" onclick="toggleMenu()" style="position:absolute; top:20px; right:20px; width:45px; height:45px; background:rgba(255,255,255,0.1); border-radius:12px; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:5px; pointer-events:auto; cursor:pointer;"><span></span><span></span><span></span></div>
    </div>

    <!-- 5. 系統選單 (要求 3: TAB / 要求 2: 選單修正) -->
    <div id="system-menu" class="screen" style="background:rgba(0,0,0,0.6); backdrop-filter:blur(8px); z-index: 6000;">
        <div class="modal">
            <div style="font-size:12px; color:#555; letter-spacing:2px; font-weight:800; margin-bottom:30px;">SYSTEM MENU</div>
            <button id="sys-0" class="menu-btn selected" onclick="toggleMenu()">繼續遊戲 / CONTINUE</button>
            <button id="sys-1" class="menu-btn" onclick="resetCurrentLevel()">重置關卡 / RESET</button>
            <button id="sys-2" class="menu-btn" style="color:#ff4444" onclick="location.reload()">返回首頁 / HOME</button>
        </div>
    </div>

    <!-- 結束畫面 -->
    <div id="game-over-screen" class="screen">
        <div class="modal" style="border: 2px solid #ff4444;">
            <h1 style="color:#ff4444; margin:0">TIME UP</h1>
            <div id="final-list" style="margin:20px 0; color:#888;"></div>
            <button id="over-0" class="menu-btn selected" onclick="restartGame()">再試一次 / RESTART</button>
            <button id="over-1" class="menu-btn" onclick="location.reload()">回到標題 / HOME</button>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    let WORD_DB = { "APPLE": { zh: "蘋果", pos: "n." }, "PIXEL": { zh: "像素", pos: "n." }, "WEAR OUT": { zh: "用壞", pos: "v. ph." } };
    let WORD_POOL = Object.keys(WORD_DB);

    let state = {
        screen: 'home', worldX: 0, worldY: 0, speed: 5.5,
        letters: [], inventory: [], completedWords: [],
        targetWord: "", timeLeft: 60, keys: {},
        isPaused: false, drillTime: 0, boostTime: 0,
        walls: [], items: [], speedPads: [],
        // 搖桿狀態
        joystick: { active: false, x: 0, y: 0, vx: 0, vy: 0 },
        // 要求 4: 鍵盤排序狀態
        isSortingMode: false,
        kbSortIdx: 0,
        kbLockedIdx: null,
        menuIdx: 0
    };

    const SAFE_ZONE = 160;

    // --- 요구 3: TAB 鍵與鍵盤控制 ---
    window.addEventListener('keydown', e => {
        if (state.screen === 'home') { startGameTrigger(); return; }

        // TAB 開關選單
        if (e.code === 'Tab') {
            e.preventDefault();
            if (state.screen === 'playing' || state.screen === 'system-menu') toggleMenu();
            return;
        }

        // 鍵盤排序模式 (要求 4)
        if (state.screen === 'playing' && document.getElementById('inventory-hud').classList.contains('altar-active')) {
            if (e.code === 'KeyE') {
                state.isSortingMode = !state.isSortingMode;
                state.kbSortIdx = 0;
                state.kbLockedIdx = null;
                updateUI();
                return;
            }
            if (state.isSortingMode) {
                if (e.code === 'ArrowLeft') handleKeyboardMove(-1);
                if (e.code === 'ArrowRight') handleKeyboardMove(1);
                if (e.code === 'Space') {
                    state.kbLockedIdx = (state.kbLockedIdx === state.kbSortIdx) ? null : state.kbSortIdx;
                    updateUI();
                }
                return; // 排序模式中禁用移動
            }
        }

        // 選單導航
        if (state.screen === 'mode-screen' || state.screen === 'system-menu' || state.screen === 'game-over-screen') {
            const count = (state.screen === 'system-menu') ? 3 : 2;
            if (e.code === 'ArrowUp' || e.code === 'ArrowLeft') state.menuIdx = (state.menuIdx - 1 + count) % count;
            if (e.code === 'ArrowDown' || e.code === 'ArrowRight') state.menuIdx = (state.menuIdx + 1) % count;
            updateMenuVisuals();
            if (e.code === 'Enter') {
                const btn = document.querySelector('.screen.active .menu-btn.selected, .screen.active .mode-option.selected');
                if (btn) btn.click();
            }
            return;
        }

        state.keys[e.code] = true;
    });
    window.addEventListener('keyup', e => state.keys[e.code] = false);

    // --- 要求 1: 虛擬搖桿邏輯 ---
    const jBase = document.getElementById('joystick-base');
    const jStick = document.getElementById('joystick-stick');
    const maxRadius = 50;

    function handleJoystick(e) {
        if (!state.joystick.active) return;
        const rect = jBase.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;

        let dx = clientX - centerX;
        let dy = clientY - centerY;
        const dist = Math.hypot(dx, dy);

        if (dist > maxRadius) {
            dx = (dx / dist) * maxRadius;
            dy = (dy / dist) * maxRadius;
        }

        jStick.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
        state.joystick.vx = dx / maxRadius;
        state.joystick.vy = dy / maxRadius;
    }

    jBase.addEventListener('mousedown', () => state.joystick.active = true);
    jBase.addEventListener('touchstart', () => state.joystick.active = true);
    window.addEventListener('mousemove', handleJoystick);
    window.addEventListener('touchmove', handleJoystick);
    window.addEventListener('mouseup', resetJoystick);
    window.addEventListener('touchend', resetJoystick);

    function resetJoystick() {
        state.joystick.active = false;
        state.joystick.vx = 0; state.joystick.vy = 0;
        jStick.style.transform = `translate(-50%, -50%)`;
    }

    // --- 要求 4: 鍵盤搬移字母 ---
    function handleKeyboardMove(dir) {
        const nextIdx = Math.max(0, Math.min(state.inventory.length - 1, state.kbSortIdx + dir));
        if (state.kbLockedIdx !== null) {
            // 如果有鎖定，直接跟鄰居交換
            [state.inventory[state.kbSortIdx], state.inventory[nextIdx]] = [state.inventory[nextIdx], state.inventory[state.kbSortIdx]];
            state.kbSortIdx = nextIdx;
            state.kbLockedIdx = nextIdx;
        } else {
            state.kbSortIdx = nextIdx;
        }
        updateUI();
        checkWin();
    }

    // --- 要求 2: 修正物件生成與畫面切換 ---
    function changeScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        const hud = document.getElementById('game-hud');
        state.menuIdx = 0;
        state.isPaused = false;
        state.isSortingMode = false;

        if (id === 'playing') {
            hud.classList.add('active');
            state.screen = 'playing';
            if (state.letters.length === 0) initLevel(); // 確保物件生成
        } else {
            hud.classList.remove('active');
            const target = document.getElementById(id);
            if(target) target.classList.add('active');
            state.screen = id;
            updateMenuVisuals();
        }
    }

    function initLevel() {
        state.targetWord = WORD_POOL[Math.floor(Math.random() * WORD_POOL.length)];
        state.inventory = []; state.letters = []; state.walls = []; state.speedPads = [];
        document.getElementById('current-target').innerText = state.targetWord;

        const chars = state.targetWord.replace(/\s+/g, '').split('');
        chars.forEach(char => {
            let rx, ry;
            do { rx = (Math.random()-0.5)*1400; ry = (Math.random()-0.5)*1400; } while (Math.hypot(rx, ry) < 130);
            state.letters.push({ x: rx, y: ry, char });
            for(let i=0; i<3; i++) {
                let wx = rx + (Math.floor(Math.random()*3)-1)*40, wy = ry + (Math.floor(Math.random()*3)-1)*40;
                if (Math.hypot(wx, wy) > SAFE_ZONE) state.walls.push({ x: wx, y: wy, w: 40, h: 40 });
            }
        });
        state.inventory = new Array(chars.length).fill("");
        
        // 加速地板
        for(let i=0; i<5; i++) {
            state.speedPads.push({ x: (Math.random()-0.5)*1200, y: (Math.random()-0.5)*1200 });
        }
        updateUI();
    }

    function update(dt) {
        if(state.screen !== 'playing' || state.isPaused || state.isSortingMode) return;

        // 合併鍵盤與搖桿速度
        let mx = 0, my = 0;
        if(state.keys['KeyW']) my = -1; if(state.keys['KeyS']) my = 1;
        if(state.keys['KeyA']) mx = -1; if(state.keys['KeyD']) mx = 1;

        if (state.joystick.vx !== 0 || state.joystick.vy !== 0) {
            mx = state.joystick.vx; my = state.joystick.vy;
        }

        const curSpeed = (state.boostTime > 0 ? state.speed * 1.5 : state.speed);
        const finalX = mx * curSpeed;
        const finalY = my * curSpeed;

        const getCol = (nx, ny) => {
            for(let w of state.walls) if(nx+14 > w.x && nx-14 < w.x+w.w && ny+14 > w.y && ny-14 < w.y+w.h) return w;
            return null;
        };
        if(!getCol(state.worldX + finalX, state.worldY)) state.worldX += finalX;
        if(!getCol(state.worldX, state.worldY + finalY)) state.worldY += finalY;

        // 拾取與環境
        if (state.boostTime > 0) state.boostTime -= dt;
        state.speedPads.forEach(p => { if(Math.hypot(p.x - state.worldX, p.y - state.worldY) < 30) state.boostTime = 3000; });
        state.letters = state.letters.filter(l => {
            if(Math.hypot(l.x - state.worldX, l.y - state.worldY) < 35) {
                const emptyIdx = state.inventory.indexOf("");
                if(emptyIdx !== -1) { state.inventory[emptyIdx] = l.char; updateUI(); return false; }
            } return true;
        });

        // 祭壇狀態
        const isAltar = Math.hypot(state.worldX, state.worldY) < 80;
        document.getElementById('inventory-hud').classList.toggle('altar-active', isAltar);
        document.getElementById('altar-keyboard-hint').classList.toggle('visible', isAltar && !state.isSortingMode);
    }

    function draw() {
        const cx = canvas.width/2, cy = canvas.height/2;
        ctx.clearRect(0,0,canvas.width,canvas.height);
        if(state.screen === 'playing') {
            ctx.strokeStyle = '#151515';
            for(let x=-state.worldX%50; x<canvas.width; x+=50) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,canvas.height); ctx.stroke(); }
            for(let y=-state.worldY%50; y<canvas.height; y+=50) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(canvas.width,y); ctx.stroke(); }
            
            state.speedPads.forEach(p => {
                ctx.fillStyle = `rgba(191, 0, 255, ${0.2 + Math.abs(Math.sin(Date.now()/300))*0.3})`;
                ctx.fillRect(cx+p.x-state.worldX-25, cy+p.y-state.worldY-25, 50, 50);
            });
            ctx.strokeStyle = '#00d2ff'; ctx.lineWidth = 4; ctx.strokeRect(cx-60-state.worldX, cy-60-state.worldY, 120, 120);
            ctx.fillStyle = '#333'; state.walls.forEach(w => ctx.fillRect(cx+w.x-state.worldX, cy+w.y-state.worldY, w.w-1, w.h-1));
            state.letters.forEach(l => {
                const lx = cx+l.x-state.worldX, ly = cy+l.y-state.worldY;
                ctx.fillStyle = '#ffcc00'; ctx.shadowBlur = 15; ctx.shadowColor = '#ffcc00';
                ctx.fillRect(lx-18, ly-18, 36, 36); ctx.shadowBlur = 0;
                ctx.fillStyle = '#000'; ctx.font = '800 22px Inter'; ctx.textAlign = 'center'; ctx.fillText(l.char, lx, ly+8);
            });
            ctx.fillStyle = '#fff'; ctx.fillRect(cx-15, cy-15, 30, 30);
            ctx.strokeStyle = '#00d2ff'; ctx.strokeRect(cx-15, cy-15, 30, 30);
        }
        update(1000/60); requestAnimationFrame(draw);
    }

    function updateUI() {
        const inv = document.getElementById('inventory-hud');
        inv.innerHTML = '';
        state.inventory.forEach((char, i) => {
            const s = document.createElement('div');
            // 要求 4: 鍵盤樣式類別
            s.className = `slot ${char ? 'has-item' : ''} ${state.isSortingMode && state.kbSortIdx === i ? 'kb-focus' : ''} ${state.isSortingMode && state.kbLockedIdx === i ? 'kb-locked' : ''}`;
            s.innerText = char || "";
            inv.appendChild(s);
        });
    }

    function checkWin() {
        if(Math.hypot(state.worldX, state.worldY) < 80 && state.inventory.join('') === state.targetWord.replace(/\s+/g, '')) {
            state.completedWords.push(state.targetWord); state.timeLeft += 60;
            initLevel();
        }
    }

    function updateMenuVisuals() {
        if (state.screen === 'mode-screen') {
            document.getElementById('mode-0').classList.toggle('selected', state.menuIdx === 0);
            document.getElementById('mode-1').classList.toggle('selected', state.menuIdx === 1);
        } else if (state.screen === 'system-menu') {
            [0,1,2].forEach(i => document.getElementById(`sys-${i}`).classList.toggle('selected', state.menuIdx === i));
        } else if (state.screen === 'game-over-screen') {
            [0,1].forEach(i => document.getElementById(`over-${i}`).classList.toggle('selected', state.menuIdx === i));
        }
    }

    function startGameTrigger() { changeScreen('mode-screen'); }
    function selectMode(m) { if(m === 'preset') startGame(); }
    function startGame() { changeScreen('playing'); state.worldX = 0; state.worldY = 0; state.timeLeft = 60; state.completedWords = []; initLevel(); }
    function resetCurrentLevel() { changeScreen('playing'); initLevel(); }
    function restartGame() { startGame(); }
    function toggleMenu() { if(state.screen==='playing') changeScreen('system-menu'); else if(state.screen==='system-menu') changeScreen('playing'); }
    function handleCustomStart() { const input = document.getElementById('custom-input').value; const lines = input.split('\n').filter(l => l.trim().length > 0); const newDB = {}; lines.forEach(line => { const match = line.match(/([a-zA-Z\s-]+)\s+([^\x00-\xff]+)\s*(.*)/); if(match) { const en = match[1].trim().toUpperCase(); newDB[en] = { zh: match[2].trim(), pos: match[3].trim() }; } }); if(Object.keys(newDB).length === 0) return alert("解析失敗"); WORD_DB = newDB; WORD_POOL = Object.keys(newDB); startGame(); }
    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }

    setInterval(() => { if(state.screen === 'playing' && !state.isPaused && !state.isSortingMode) { state.timeLeft--; document.getElementById('time-val').innerText = state.timeLeft; if(state.timeLeft <= 0) changeScreen('game-over-screen'); } }, 1000);
    window.addEventListener('resize', resize); resize();
    requestAnimationFrame(draw);
</script>
</body>
</html>
